<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STM32 Live Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
#header { background: #16213e; padding: 8px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #0f3460; flex-wrap: wrap; }
#header h1 { font-size: 1.1em; color: #e94560; white-space: nowrap; }
.controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.controls button, .controls select, .controls input { background: #0f3460; color: #e0e0e0; border: 1px solid #1a508b; padding: 4px 10px; border-radius: 4px; font-size: 0.82em; cursor: pointer; }
.controls button:hover { background: #1a508b; }
.controls button.active { background: #e94560; border-color: #e94560; }
#main { display: flex; flex: 1; overflow: hidden; }
#left-panel { width: 300px; min-width: 220px; background: #16213e; border-right: 1px solid #0f3460; display: flex; flex-direction: column; overflow: hidden; }
.tab-bar { display: flex; border-bottom: 1px solid #0f3460; }
.tab-bar button { flex: 1; padding: 6px; background: transparent; color: #888; border: none; cursor: pointer; font-size: 0.8em; border-bottom: 2px solid transparent; }
.tab-bar button.active { color: #e94560; border-bottom-color: #e94560; }
.search-box { padding: 6px 8px; }
.search-box input { width: 100%; padding: 6px 10px; background: #0f3460; color: #e0e0e0; border: 1px solid #1a508b; border-radius: 4px; font-size: 0.82em; }
.search-box input::placeholder { color: #666; }
.tree-container { flex: 1; overflow-y: auto; padding: 2px 0; }
.module-group { margin: 1px 0; }
.module-header { padding: 5px 10px; background: #0f3460; font-size: 0.78em; font-weight: 600; color: #a0a0c0; cursor: pointer; user-select: none; display: flex; justify-content: space-between; }
.module-header:hover { background: #1a508b; }
.module-header .count { font-size: 0.7em; color: #888; }
.module-vars.collapsed { display: none; }
.var-item { padding: 2px 8px 2px 20px; font-size: 0.78em; cursor: pointer; display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.var-item:hover { background: #1a3a5c; }
.var-item.watched { background: #1a3a5c; }
.var-item input[type="checkbox"] { accent-color: #e94560; flex-shrink: 0; }
.type-tag { font-size: 0.65em; color: #888; background: #0f3460; padding: 1px 4px; border-radius: 2px; flex-shrink: 0; }
#center-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 320px; }
#watch-table-wrap { flex: 1; overflow-y: auto; padding: 6px; }
#watch-table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
#watch-table th { position: sticky; top: 0; background: #16213e; padding: 5px 8px; text-align: left; font-size: 0.78em; color: #a0a0c0; border-bottom: 2px solid #0f3460; z-index: 1; }
#watch-table td { padding: 3px 8px; border-bottom: 1px solid #1a2a40; font-family: 'Consolas', 'Cascadia Code', monospace; }
#watch-table .val-cell { text-align: right; }
#watch-table .hex-cell { color: #888; font-size: 0.8em; }
.trend-up { color: #4ecca3; }
.trend-down { color: #e94560; }
#watch-table tr:hover td { background: #1a2a40; }
#chart-panel { height: 260px; background: #16213e; border-top: 1px solid #0f3460; }
#status-bar { background: #16213e; padding: 4px 16px; display: flex; align-items: center; gap: 16px; font-size: 0.73em; color: #888; border-top: 1px solid #0f3460; flex-wrap: wrap; }
#status-bar .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
#status-bar .dot.online { background: #4ecca3; }
#status-bar .dot.offline { background: #e94560; }
.empty-hint { padding: 40px 16px; text-align: center; color: #666; font-size: 0.85em; }
.btn-icon { font-size: 1.1em; padding: 3px 8px !important; }
/* Modal */
.modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: #16213e; border: 1px solid #0f3460; border-radius: 8px; padding: 20px; z-index: 10; max-width: 420px; width: 92%; max-height: 70vh; overflow-y: auto; }
.modal.show { display: block; }
.modal h3 { margin-bottom: 12px; color: #e94560; }
.preset-item { padding: 8px 12px; cursor: pointer; border-radius: 4px; margin: 3px 0; }
.preset-item:hover { background: #1a3a5c; }
#overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9; }
#overlay.show { display: block; }
#periph-tree .collapsed { display: none; }
</style>
</head>
<body>

<div id="header">
  <h1>⚡ STM32 Monitor</h1>
  <div class="controls">
    <button id="btn-save-group" class="btn-icon" title="Save current watch list">💾 Save</button>
    <button id="btn-load-group" class="btn-icon" title="Load saved watch group">📂 Load</button>
    <button id="btn-pause" title="Pause/Resume">⏯️ Pause</button>
    <select id="sel-interval" title="Refresh interval">
      <option value="100">100ms</option>
      <option value="200">200ms</option>
      <option value="500">500ms</option>
      <option value="1000" selected>1s</option>
      <option value="2000">2s</option>
      <option value="5000">5s</option>
    </select>
    <button id="btn-ai" title="Export snapshot + release probe for AI analysis">🤖 AI Analyze</button>
    <button id="btn-reconnect" style="display:none;" title="Reconnect probe">🔌 Reconnect</button>
    <button id="btn-csv" title="Download history as CSV">📥 CSV</button>
  </div>
</div>

<div id="main">
  <!-- Left: Variable + Peripheral browser -->
  <div id="left-panel">
    <div class="tab-bar">
      <button id="tab-vars" class="active" onclick="switchTab('vars')">📊 Variables</button>
      <button id="tab-periph" onclick="switchTab('periph')">🔧 Peripherals</button>
    </div>
    <div id="tab-vars-panel" class="search-box">
      <input type="text" id="var-search" placeholder="🔍 Search variables..." autocomplete="off">
    </div>
    <div id="tab-periph-panel" class="search-box" style="display:none;">
      <input type="text" id="periph-search" placeholder="🔍 Search peripherals..." autocomplete="off">
    </div>
    <div class="tree-container">
      <div id="var-tree"><div class="empty-hint">Loading symbols...</div></div>
      <div id="periph-tree" style="display:none;"><div class="empty-hint">No SVD file</div></div>
    </div>
  </div>

  <!-- Center: Watch table + Chart -->
  <div id="center-panel">
    <div id="watch-table-wrap">
      <table id="watch-table">
        <thead><tr><th>Name</th><th>Type</th><th>Value</th><th>Hex</th><th>Trend</th><th></th></tr></thead>
        <tbody id="watch-tbody">
          <tr><td colspan="6" class="empty-hint">Check variables on the left to start monitoring</td></tr>
        </tbody>
      </table>
    </div>
    <div id="chart-panel"></div>
  </div>
</div>

<div id="status-bar">
  <span><span class="dot online" id="status-dot"></span><span id="status-text">Connecting...</span><span id="status-paused"></span></span>
  <span id="status-rate">1.0 Hz</span>
  <span id="status-vars">0 vars</span>
  <span id="status-time">0:00</span>
</div>

<!-- Group load modal -->
<div id="overlay" onclick="closeModals()"></div>
<div id="group-modal" class="modal">
  <h3>📂 Saved Watch Groups</h3>
  <div id="group-list"></div>
  <button onclick="closeModals()" style="margin-top:12px;width:100%;">Cancel</button>
</div>

<script src="/static/app.js"></script>
</body>
</html>
