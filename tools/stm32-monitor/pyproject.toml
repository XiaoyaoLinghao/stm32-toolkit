[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stm32-monitor"
version = "0.4.0"
description = "Project-isolated STM32 monitor service for STM32 Toolkit"
requires-python = ">=3.10"
dependencies = [
    "stm32-toolkit==0.4.0",
    "aiohttp>=3.9,<4",
]
license = {text = "MIT"}
authors = [
    {name = "STM32 Toolkit Team"}
]
keywords = ["stm32", "embedded", "debug", "monitor"]

[project.scripts]
stm32-monitor = "stm32_monitor.cli:main"

[project.urls]
Homepage = "https://github.com/konbakuyomu/stm32-toolkit"

[tool.setuptools.packages.find]
where = ["src"]
