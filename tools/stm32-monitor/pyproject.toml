[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stm32-monitor"
version = "0.1.0"
description = "Real-time variable monitor for STM32 embedded targets via PyOCD"
requires-python = ">=3.10"
dependencies = [
    "pyocd>=0.45",
    "aiohttp>=3.9",
    "cmsis-svd>=0.5",
    "pyyaml>=6.0",
]
license = {text = "MIT"}
authors = [
    {name = "STM32 Toolkit Team"}
]
keywords = ["stm32", "embedded", "debug", "pyocd", "monitor"]

[project.scripts]
stm32-monitor = "stm32_monitor.cli:main"

[project.urls]
Homepage = "https://github.com/konbakuyomu/stm32-toolkit"

[tool.setuptools.packages.find]
where = ["src"]
