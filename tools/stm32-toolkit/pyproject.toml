[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stm32-toolkit"
version = "0.9.0"
description = "Agent-neutral STM32 development toolkit"
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema==4.26.0",
  "mcp==1.29.0",
  "pyelftools==0.33",
  "Jinja2==3.1.6",
  "aiohttp==3.14.3",
]

[project.optional-dependencies]
probe = ["pyocd==0.45.1", "pyserial==3.5"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
stm32-toolkit = "stm32_toolkit.cli:main"
stm32-toolkit-mcp = "stm32_toolkit.mcp_server:main"

[project.urls]
Homepage = "https://github.com/XiaoyaoLinghao/stm32-toolkit"
Repository = "https://github.com/XiaoyaoLinghao/stm32-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stm32_toolkit = ["schemas/*.json", "templates/cmake/*", "templates/vscode/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
